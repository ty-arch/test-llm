services:
  chat:
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    ports:
      - "${CHAT_API_PORT:-4001}:${CHAT_API_PORT:-4001}"
    environment:
      CHAT_API_PORT: "${CHAT_API_PORT:-4001}"
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:${CHAT_API_PORT:-4001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-web:
    build:
      context: ../..
      dockerfile: clients/chat-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://chat:${CHAT_API_PORT:-4001}"
    ports:
      - "${CHAT_WEB_PORT:-3002}:${CHAT_WEB_PORT:-3002}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://chat:${CHAT_API_PORT:-4001}"
      PORT: "${CHAT_WEB_PORT:-3002}"
    depends_on:
      chat:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  admin:
    build:
      context: ../..
      dockerfile: services/admin/Dockerfile
    environment:
      DATABASE_URL: "postgresql://admin:admin@postgres:5432/admin?schema=public"
      JWT_SECRET: "dev-secret"
      ADMIN_API_PORT: "${ADMIN_API_PORT:-4002}"
      CORS_ORIGIN: "http://localhost:${ADMIN_WEB_PORT:-3003}"
      SEED_ADMIN_PASSWORD: "admin123"
    ports:
      - "${ADMIN_API_PORT:-4002}:${ADMIN_API_PORT:-4002}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:${ADMIN_API_PORT:-4002}/auth/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin-web:
    build:
      context: ../..
      dockerfile: clients/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${ADMIN_API_PORT:-4002}"
    ports:
      - "${ADMIN_WEB_PORT:-3003}:${ADMIN_WEB_PORT:-3003}"
    environment:
      PORT: "${ADMIN_WEB_PORT:-3003}"
    depends_on:
      admin:
        condition: service_healthy

volumes:
  pgdata:
