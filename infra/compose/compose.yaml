services:
  chat:
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    ports:
      - "4001:4001"
    environment:
      PORT: "4001"
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-web:
    build:
      context: ../..
      dockerfile: clients/chat-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://chat:4001"
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://chat:4001"
    depends_on:
      chat:
        condition: service_healthy
