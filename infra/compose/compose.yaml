services:
  chat:
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    ports:
      - "4001:4001"
    environment:
      PORT: "4001"
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-web:
    build:
      context: ../..
      dockerfile: clients/chat-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://chat:4001"
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://chat:4001"
    depends_on:
      chat:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  admin:
    build:
      context: ../..
      dockerfile: services/admin/Dockerfile
    environment:
      DATABASE_URL: "postgresql://admin:admin@postgres:5432/admin?schema=public"
      JWT_SECRET: "dev-secret"
      PORT: "4002"
      SEED_ADMIN_PASSWORD: "admin123"
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:4002/auth/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin-web:
    build:
      context: ../..
      dockerfile: clients/admin-web/Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      admin:
        condition: service_healthy

volumes:
  pgdata:
