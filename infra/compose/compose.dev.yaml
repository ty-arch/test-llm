# Development override: mount source and run the dev servers.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up
services:
  chat:
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/packages/contracts/node_modules
      - /app/services/chat/node_modules
    command: ["bun", "run", "dev"]
    environment:
      NODE_ENV: development
      CHAT_API_PORT: "${CHAT_API_PORT:-4001}"
      CHAT_WEB_PORT: "${CHAT_WEB_PORT:-3002}"

  chat-web:
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/packages/contracts/node_modules
      - /app/clients/chat-web/node_modules
      - /app/clients/chat-web/.next
    command: ["bun", "run", "dev"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: "http://chat:${CHAT_API_PORT:-4001}"
      CHAT_WEB_PORT: "${CHAT_WEB_PORT:-3002}"

  admin:
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/services/admin/node_modules
    command: ["bun", "run", "dev"]
    environment:
      NODE_ENV: development
      ADMIN_API_PORT: "${ADMIN_API_PORT:-4002}"
      ADMIN_WEB_PORT: "${ADMIN_WEB_PORT:-3003}"

  admin-web:
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/clients/admin-web/node_modules
      - /app/clients/admin-web/.next
    command: ["bun", "run", "dev"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:${ADMIN_API_PORT:-4002}"
      ADMIN_WEB_PORT: "${ADMIN_WEB_PORT:-3003}"
